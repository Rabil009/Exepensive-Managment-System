    <text x="0" y="60" class="subtitle">2. Tax has been charged at the rate of 18% Integrated Goods and Services Tax (IGST) under HSN/SAC code 998315.</text>
    <text x="0" y="75" class="subtitle">3. Customer is entitled to claim Input Tax Credit (ITC) subject to applicable provisions of Section 16 &amp; 17 of the CGST Act.</text>
    <text x="0" y="90" class="subtitle">4. For support inquiries regarding AWS billing or cloud resources, visit https://aws.amazon.com/contact-us or support portal.</text>

