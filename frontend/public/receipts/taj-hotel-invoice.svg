<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <style>
    .title { font-size: 22px; font-weight: 700; fill: #1f2937; }
    .subtitle { font-size: 11px; fill: #6b7280; }
    .label { font-size: 11px; font-weight: 600; fill: #4b5563; text-transform: uppercase; letter-spacing: 0.5px; }
    .val { font-size: 13px; font-weight: 500; fill: #111827; }
    .val-bold { font-size: 14px; font-weight: 700; fill: #111827; }
    .th { font-size: 11px; font-weight: 600; fill: #374151; text-transform: uppercase; letter-spacing: 0.5px; }
    .td { font-size: 12px; fill: #1f2937; }
    .divider { stroke: #e5e7eb; stroke-width: 1; }
  </style>

  <!-- Outer Border Container -->
  <rect x="20" y="20" width="760" height="1010" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- Top Accent Bar (Taj Luxury Gold / Charcoal) -->
  <path d="M 20 28 Q 20 20 28 20 L 772 20 Q 780 20 780 28 L 780 32 L 20 32 Z" fill="#18181b"/>
  <rect x="20" y="32" width="760" height="4" fill="#b45309"/>

  <!-- Header -->
  <g transform="translate(50, 65)">
    <!-- Hotel Brand -->
    <text x="0" y="22" font-size="24" font-weight="800" fill="#78350f" letter-spacing="2">TAJ</text>
    <text x="55" y="20" font-size="14" font-weight="600" fill="#71717a">| LANDS END, MUMBAI</text>
    <text x="0" y="38" class="subtitle">The Indian Hotels Company Limited</text>
    <text x="0" y="52" class="subtitle">BJ Road, Bandstand Promenade, Bandra West, Mumbai, Maharashtra 400050</text>
    <text x="0" y="66" class="subtitle">GSTIN: 27AAACT1234F1Z9 &bull; CIN: L74999MH1902PLC000183 &bull; SAC: 996331 (Restaurant &amp; Dining)</text>

    <!-- Invoice Badge -->
    <rect x="520" y="0" width="180" height="74" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1"/>
    <text x="535" y="20" class="label" fill="#854d0e">F&amp;B TAX INVOICE</text>
    <text x="535" y="38" class="val-bold" fill="#713f12">TAJ-MUM-84920</text>
    <text x="535" y="52" class="subtitle">Date: 11 Oct 2026</text>
    <text x="535" y="66" class="subtitle">Time: 09:45 PM</text>
  </g>

  <!-- Divider -->
  <line x1="50" y1="160" x2="750" y2="160" class="divider"/>

  <!-- Dining & Guest Metadata -->
  <g transform="translate(50, 180)">
    <!-- Col 1: Guest -->
    <text x="0" y="0" class="label">GUEST / BILLED TO</text>
    <text x="0" y="20" class="val-bold">FinPulse Corporate Account</text>
    <text x="0" y="36" class="subtitle">Host Employee: Aditya Chaubey / Ahammed Rabil</text>
    <text x="0" y="50" class="subtitle">Purpose: Q4 Strategic Architecture Client Dinner</text>
    <text x="0" y="64" class="subtitle">Attendees: 4 Pax (Client Executive Delegation)</text>

    <!-- Col 2: Table & Settlement -->
    <text x="440" y="0" class="label">VENUE &amp; TABLE</text>
    <text x="440" y="20" class="val-bold">Vista Multi-Cuisine Lounge</text>
    <text x="440" y="36" class="subtitle">Table No: Table 14 (Private Dining Room)</text>
    <text x="440" y="50" class="subtitle">Steward: Chef Sanjeev &bull; KOT #4810</text>
    <text x="440" y="64" class="subtitle">Settlement: HDFC Business Debit Card</text>
  </g>

  <!-- Table Header -->
  <g transform="translate(50, 275)">
    <rect x="0" y="0" width="700" height="32" rx="4" fill="#f4f4f5"/>
    <text x="20" y="21" class="th">MENU ITEM &amp; DESCRIPTION</text>
    <text x="380" y="21" class="th">HSN/SAC</text>
    <text x="490" y="21" class="th text-right">QTY</text>
    <text x="680" y="21" class="th" text-anchor="end">AMOUNT (INR)</text>
  </g>

  <!-- Table Rows -->
  <g transform="translate(50, 320)">
    <!-- Row 1: Chef Tasting Menu -->
    <text x="20" y="0" class="td" font-weight="600">Executive 4-Course Degustation Menu</text>
    <text x="20" y="16" class="subtitle">Signature Coastal Gourmet Chef Selection (4 Covers)</text>
    <text x="380" y="0" class="td">996331</text>
    <text x="490" y="0" class="td">4</text>
    <text x="680" y="0" class="td" font-weight="600" text-anchor="end">₹6,200.00</text>
    <line x1="0" y1="28" x2="700" y2="28" class="divider"/>

    <!-- Row 2: Mineral Water & Mocktails -->
    <text x="20" y="48" class="td" font-weight="600">Himalayan Artisan Sparkling Water &amp; Artisan Mocktails</text>
    <text x="20" y="64" class="subtitle">Sparkling Waters, Fresh Mint Mocktails, Aerated Refreshments</text>
    <text x="380" y="48" class="td">996331</text>
    <text x="490" y="48" class="td">4</text>
    <text x="680" y="48" class="td" font-weight="600" text-anchor="end">₹966.10</text>
    <line x1="0" y1="76" x2="700" y2="76" class="divider"/>

    <!-- Subtotal -->
    <text x="440" y="98" class="td" font-weight="600">Food &amp; Beverage Subtotal:</text>
    <text x="680" y="98" class="td" font-weight="600" text-anchor="end">₹7,166.10</text>
    <line x1="440" y1="110" x2="700" y2="110" class="divider"/>

    <!-- Service Charge -->
    <text x="440" y="128" class="td">Discretionary Service Charge (7.91%):</text>
    <text x="680" y="128" class="td" text-anchor="end">₹567.30</text>
    <line x1="440" y1="140" x2="700" y2="140" class="divider"/>

    <!-- Central GST (CGST 2.5%) -->
    <text x="440" y="158" class="td">Central GST (CGST @ 2.5%):</text>
    <text x="680" y="158" class="td" text-anchor="end">₹358.30</text>
    <line x1="440" y1="170" x2="700" y2="170" class="divider"/>

    <!-- State GST (SGST 2.5%) -->
    <text x="440" y="188" class="td">State GST (SGST @ 2.5%):</text>
    <text x="680" y="188" class="td" text-anchor="end">₹358.30</text>
    <line x1="0" y1="204" x2="700" y2="204" stroke="#18181b" stroke-width="1.5"/>
  </g>

  <!-- Total Summary Box -->
  <g transform="translate(450, 550)">
    <rect x="0" y="0" width="300" height="90" rx="6" fill="#fefce8" stroke="#fef08a" stroke-width="1.5"/>
    <text x="20" y="30" class="label" fill="#854d0e">TOTAL INVOICE CHARGE</text>
    <text x="20" y="62" font-size="28" font-weight="800" fill="#78350f">₹8,450.00</text>
    <text x="20" y="78" class="subtitle">Indian Rupees Eight Thousand Four Hundred Fifty Only</text>
  </g>

  <!-- Paid Stamp -->
  <g transform="translate(80, 565)">
    <rect x="0" y="0" width="160" height="52" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="80" y="22" font-size="12" font-weight="800" fill="#047857" text-anchor="middle" letter-spacing="1">PAID IN FULL</text>
    <text x="80" y="40" font-size="10" font-weight="600" fill="#065f46" text-anchor="middle">Card Auth: #849201</text>
  </g>

  <!-- Legal & Tax Compliance Footer -->
  <g transform="translate(50, 670)">
    <line x1="0" y1="0" x2="700" y2="0" class="divider"/>
    <text x="0" y="25" class="label">HOTEL POLICY &amp; GST NOTICE</text>
    <text x="0" y="45" class="subtitle">1. This bill is an authentic Tax Invoice under Section 31 of CGST Act, 2017 for restaurant and dining services (SAC 996331).</text>
    <text x="0" y="60" class="subtitle">2. GST is levied at 5% (2.5% CGST + 2.5% SGST) without Input Tax Credit under Notification No. 46/2017-Central Tax (Rate).</text>
    <text x="0" y="75" class="subtitle">3. Thank you for dining with Taj Lands End Mumbai. For hotel reservations, visit tajhotels.com or call +91 22 6668 1234.</text>

    <!-- Barcode -->
    <rect x="0" y="100" width="700" height="40" fill="#f4f4f5" stroke="#e4e4e7" rx="4"/>
    <text x="350" y="125" font-family="Courier, monospace" font-size="14" font-weight="700" fill="#3f3f46" text-anchor="middle" letter-spacing="4">*TAJ84920MUM20261011*</text>
  </g>
</svg>

